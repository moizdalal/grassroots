<!-- Parked from public/profile.html on 2026-05-17 to remove load-time
     cost (model-viewer ~200KB + seedling.glb 5.2MB + inline IIFE).

     The original placement: between the metrics section
     (#pp-metrics-section) and the reviews section
     (#pp-reviews-section), inside the .pp-page section block.

     Also reattach in <head>:
       <link rel="stylesheet" href="/profile-seedling.css" />
     The <script type="module" src=".../model-viewer.min.js"> tag below
     is part of this block — moving the block back restores both. -->

<!-- model-viewer powers the interactive 3D seedling on stage 0 of the
     consultant progression card. loaded as a module so it registers the
     <model-viewer> custom element. -->
<script
  type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
></script>

<!-- Consultant-only: progression card (moved from settings) -->
<section class="pp-section pp-section--progression hidden" id="pp-progression-section">
  <div class="pf-level-card pf-level-card--hero" id="pf-level-card">
    <div class="pf-level-card__copy">
      <p class="pf-level-kicker">consultant progression</p>
      <h2 class="pf-level-title" id="pf-level-title">stage 0: seedling</h2>
      <div class="pf-level-meta">
        <p class="pf-level-name" id="pf-level-name">consultant</p>
      </div>
      <div class="pf-level-progress">
        <div class="pf-level-progress__row">
          <span>progress to next stage</span>
          <span id="pf-level-progress-label">0%</span>
        </div>
        <div class="pf-level-progress__track" aria-hidden="true">
          <span class="pf-level-progress__fill" id="pf-level-progress-fill"></span>
        </div>
        <p class="pf-level-progress__copy" id="pf-level-progress-copy">
          complete 1 free engagement and earn an average rating of at least 4.0 stars.
        </p>
      </div>
    </div>
    <div class="pf-stage-model" id="pf-stage-model" data-stage="0" aria-hidden="true">
      <!-- stage 0: interactive 3d seedling. drag to rotate, wind sway
           plays on autoload. css below hides this for stages 1+ and
           falls back to the gradient scene placeholder. -->
      <model-viewer
        class="pf-stage-model__viewer"
        id="pf-stage-model-viewer"
        src="/assets/seedling.glb"
        alt="seedling sprouting from a cracked seed"
        autoplay
        camera-controls
        interaction-prompt="none"
        disable-zoom
        disable-pan
        field-of-view="36deg"
        camera-orbit="0deg 80deg 8.5m"
        camera-target="0m 1.6m 0m"
        min-camera-orbit="auto 65deg 8.5m"
        max-camera-orbit="auto 95deg 8.5m"
        shadow-intensity="0"
        exposure="1.05"
        loading="eager"
      ></model-viewer>
      <script>
        // The seedling glb exports one animation per object (WindRoot,
        // LeafR_pivot, LeafL_pivot). model-viewer's autoplay only fires
        // the first one. To get the stem and each leaf moving with
        // independent wind, we reach into model-viewer's internal
        // three.js scene on load and start every clip on the shared
        // AnimationMixer.
        (() => {
          const viewer = document.getElementById('pf-stage-model-viewer');
          if (!viewer) return;
          const playAllClips = () => {
            const sceneSym = Object.getOwnPropertySymbols(viewer)
              .find(s => s.description === 'scene');
            const scene = sceneSym && viewer[sceneSym];
            if (!scene || !scene.mixer || !Array.isArray(scene.animations)) return;
            // Stop any single-clip action that autoplay started so it
            // doesn't conflict with us starting every clip.
            scene.mixer.stopAllAction();
            for (const clip of scene.animations) {
              const action = scene.mixer.clipAction(clip);
              action.reset();
              action.setLoop(window.THREE?.LoopRepeat ?? 2201, Infinity);
              action.play();
            }
          };
          viewer.addEventListener('load', playAllClips, { once: true });
          if (viewer.loaded) playAllClips();
        })();
      </script>
      <div class="pf-stage-model__scene">
        <span class="pf-stage-model__glow"></span>
        <span class="pf-stage-model__soil"></span>
        <span class="pf-stage-model__shadow"></span>
        <span class="pf-stage-model__stem"></span>
        <span class="pf-stage-model__canopy"></span>
        <span class="pf-stage-model__canopy pf-stage-model__canopy--secondary"></span>
        <span class="pf-stage-model__canopy pf-stage-model__canopy--tertiary"></span>
        <span class="pf-stage-model__accent"></span>
      </div>
      <p class="pf-stage-model__label" id="pf-stage-model-label">stage 0: seedling</p>
    </div>
  </div>
</section>
