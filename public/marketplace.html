<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>grassroots — marketplace</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/grassroots.css" />
    <link rel="stylesheet" href="/field-office.css" />
    <script>
      // Marketplace is normally signed-in only. Synchronous pre-check:
      // if no Supabase auth token sits in localStorage, redirect to
      // signin before the page shell renders so members never see a
      // flash of the marketplace under the wrong layout. The async
      // session check in marketplace.js remains the authoritative gate
      // (catches expired tokens this pre-check can't validate).
      //
      // Guest mode exception: visitors arriving from the marketing
      // pages with ?guest=1 (or with the sessionStorage flag already
      // set from an earlier in-tab navigation) get to browse without
      // signing in. We persist the flag here in the inline script so
      // that internal navigations within the guest tab don't need to
      // re-pass the URL param.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var isGuest = params.get("guest") === "1"
            || sessionStorage.getItem("grassroots_guest_mode") === "1";
          if (isGuest) {
            try { sessionStorage.setItem("grassroots_guest_mode", "1"); } catch (_) {}
            return;
          }
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf("sb-") === 0 && k.indexOf("-auth-token") !== -1) {
              var v = localStorage.getItem(k);
              if (v && v !== "null" && v !== "{}") return;
            }
          }
          window.location.replace(
            "/signin.html?next=" + encodeURIComponent("/marketplace.html"),
          );
        } catch (_) {
          /* storage unavailable — let the JS layer handle it. */
        }
      })();
    </script>
    <script src="/theme.js"></script>
  </head>
  <body class="gr-body"><main class="gr-shell gr-shell--wide marketplace-shell">
      <div class="gr-page-header">
        <div class="gr-page-intro">
          <h1 class="gr-title">opportunities <span class="fo-title-italic">live now</span></h1>
          <p class="gr-subtitle">small businesses post real work. students bid, deliver, and build their portfolios. updated daily.</p>
        </div>
        <div id="page-cta-slot"></div>
      </div>

      <div id="session-slot" class="gr-session-slot" aria-live="polite"></div>

      <!-- Guest conversion banner — populated by marketplace.js when
           guest mode is detected, empty otherwise. -->
      <div id="guest-banner-slot" hidden></div>

      <!-- Search / Filter -->
      <div class="gr-search-bar" id="search-bar">
        <input class="gr-search-bar__input" type="text" id="filter-search" placeholder="search by title, business, or keyword…" />
        <select class="gr-search-bar__select" id="filter-category">
          <option value="">all categories</option>
        </select>
        <div class="gr-search-bar__budget-row">
          <span>$</span>
          <input class="gr-search-bar__budget-input" type="number" id="filter-budget-min" placeholder="min" min="0" />
          <span>–</span>
          <input class="gr-search-bar__budget-input" type="number" id="filter-budget-max" placeholder="max" min="0" />
        </div>
      </div>
      <div class="gr-filter-active-tags" id="active-filters"></div>

      <section aria-label="Open listings">
        <p class="mkt-result-count" id="result-count" aria-live="polite"></p>
        <div id="listing-grid" class="gr-listing-grid"></div>
        <p id="listings-status" class="gr-status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="/guest-nav.js"></script>
    <script type="module" src="/nav-session.js"></script>
    <script type="module" src="/marketplace.js"></script>

    <script defer src="/suggestion-box.js"></script>
    <script type="module" src="/side-nav.js"></script>
    <script defer src="/perf-beacon.js"></script>
  </body>
</html>
