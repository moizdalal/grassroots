<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>grassroots — reset password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/grassroots.css" />
    <link rel="stylesheet" href="/field-office.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="gr-body">
    <nav class="gr-nav" aria-label="Primary">
      <div class="gr-nav__inner">
        <a class="gr-nav__brand" href="/">
          <img class="gr-nav__logo" src="/home/assets/grassroots-icon-syne.svg" width="20" height="34" alt="" />
          <span class="gr-nav__wordmark">grassroots</span>
        </a>
        <ul class="gr-nav__links">
          <li><a href="/signin.html">sign in</a></li>
        </ul>
      </div>
    </nav>

    <main class="gr-shell">
      <div class="gr-page-intro">
        <h1 class="gr-title">set a new <span class="fo-title-italic">password</span></h1>
        <p class="gr-subtitle">choose something memorable. you'll be signed in after this.</p>
      </div>

      <div class="gr-card gr-auth-card">
        <p id="rp-gate" class="gr-status" aria-live="polite">verifying your reset link…</p>

        <form id="rp-form" hidden>
          <div class="gr-field-stack">
            <label class="gr-label">
              <span>new password</span>
              <div class="gr-pw-field">
                <input
                  type="password"
                  name="password"
                  id="rp-password"
                  minlength="8"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  class="gr-pw-toggle"
                  data-pw-toggle="rp-password"
                  aria-label="show password"
                  aria-pressed="false"
                >
                  <svg class="gr-pw-toggle__eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="gr-pw-toggle__eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.06 10.06 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                </button>
              </div>
              <ul class="reg-pw-rules" id="rp-pw-rules" aria-live="polite">
                <li data-rule="length">at least 8 characters</li>
                <li data-rule="uppercase">an uppercase letter</li>
                <li data-rule="lowercase">a lowercase letter</li>
                <li data-rule="number">a number</li>
                <li data-rule="special">a special character</li>
              </ul>
            </label>
            <label class="gr-label">
              <span>confirm new password</span>
              <input
                type="password"
                name="passwordConfirm"
                id="rp-password-confirm"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </label>
          </div>

          <div class="gr-auth-actions">
            <button type="submit" class="gr-btn gr-btn--primary" id="rp-submit">update password</button>
          </div>
        </form>

        <p id="rp-status" class="gr-status" aria-live="polite"></p>
      </div>
    </main>

    <script type="module">
      import { getSupabaseClient } from "/supabase-loader.js";

      const gate = document.getElementById("rp-gate");
      const form = document.getElementById("rp-form");
      const submitBtn = document.getElementById("rp-submit");
      const statusEl = document.getElementById("rp-status");
      const pwInput = document.getElementById("rp-password");
      const pwConfirmInput = document.getElementById("rp-password-confirm");

      let recoveryReady = false;

      function showForm() {
        if (recoveryReady) return;
        recoveryReady = true;
        gate.hidden = true;
        form.hidden = false;
        pwInput.focus();
      }

      function showError(msg) {
        gate.textContent = msg;
        gate.className = "gr-status error";
        gate.hidden = false;
        form.hidden = true;
      }

      (async () => {
        const supabase = await getSupabaseClient();

        // Supabase parses the recovery token from the URL hash and fires a
        // PASSWORD_RECOVERY auth event. If we already have a session by the
        // time this script runs (race), we can show the form immediately.
        supabase.auth.onAuthStateChange((event) => {
          if (event === "PASSWORD_RECOVERY") showForm();
        });

        // Fallback: if the URL hash carries a recovery token but the event
        // didn't fire (e.g. older supabase-js builds), check the session
        // after a brief wait.
        setTimeout(async () => {
          if (recoveryReady) return;
          const { data: { session } } = await supabase.auth.getSession();
          if (session?.user) {
            showForm();
          } else {
            showError("this reset link is invalid or has expired. request a new one from the forgot-password page.");
          }
        }, 1200);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (pwInput.value !== pwConfirmInput.value) {
            statusEl.textContent = "passwords don't match.";
            statusEl.className = "gr-status error";
            return;
          }
          if (pwInput.value.length < 8) {
            statusEl.textContent = "password must be at least 8 characters.";
            statusEl.className = "gr-status error";
            return;
          }
          submitBtn.disabled = true;
          statusEl.textContent = "updating…";
          statusEl.className = "gr-status";

          const { error } = await supabase.auth.updateUser({ password: pwInput.value });
          if (error) {
            statusEl.textContent = error.message || "could not update password.";
            statusEl.className = "gr-status error";
            submitBtn.disabled = false;
            return;
          }

          statusEl.textContent = "password updated. redirecting…";
          statusEl.className = "gr-status success";

          // Route them to their dashboard if we can read the role; otherwise home.
          try {
            const { data: { user } } = await supabase.auth.getUser();
            if (user?.id) {
              const { data: profile } = await supabase
                .from("profiles")
                .select("role")
                .eq("id", user.id)
                .maybeSingle();
              const dest =
                profile?.role === "business_owner"
                  ? "/dashboard.html"
                  : profile?.role === "consultant"
                    ? "/consultant-dashboard.html"
                    : "/";
              setTimeout(() => { window.location.href = dest; }, 700);
              return;
            }
          } catch (_) {}
          setTimeout(() => { window.location.href = "/"; }, 700);
        });
      })();

      // Reuse the password reveal toggle pattern from signin.
      document.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-pw-toggle]");
        if (!btn) return;
        const input = document.getElementById(btn.dataset.pwToggle);
        if (!input) return;
        const reveal = input.type === "password";
        input.type = reveal ? "text" : "password";
        btn.setAttribute("aria-pressed", String(reveal));
        btn.setAttribute("aria-label", reveal ? "hide password" : "show password");
        btn.classList.toggle("gr-pw-toggle--shown", reveal);
      });

      // Live password requirements feedback (mirrors register-flow.js).
      const pwRules = document.getElementById("rp-pw-rules");
      if (pwInput && pwRules) {
        const rules = {
          length: (v) => v.length >= 8,
          uppercase: (v) => /[A-Z]/.test(v),
          lowercase: (v) => /[a-z]/.test(v),
          number: (v) => /\d/.test(v),
          special: (v) => /[^A-Za-z0-9]/.test(v),
        };
        const updateRules = () => {
          const v = pwInput.value;
          pwRules.querySelectorAll("[data-rule]").forEach((li) => {
            const ok = !!rules[li.dataset.rule]?.(v);
            li.classList.toggle("is-met", ok);
          });
        };
        pwInput.addEventListener("input", updateRules);
        updateRules();
      }
    </script>
    <script defer src="/perf-beacon.js"></script>
  </body>
</html>
