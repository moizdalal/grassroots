<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>grassroots — forgot password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/grassroots.css" />
    <link rel="stylesheet" href="/field-office.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="gr-body">
    <nav class="gr-nav" aria-label="Primary">
      <div class="gr-nav__inner">
        <a class="gr-nav__brand" href="/">
          <img class="gr-nav__logo" src="/home/assets/grassroots-icon-syne.svg" width="20" height="34" alt="" />
          <span class="gr-nav__wordmark">grassroots</span>
        </a>
        <ul class="gr-nav__links">
          <li><a href="/signin.html">sign in</a></li>
          <li><a href="/register.html" class="gr-nav__cta">register</a></li>
        </ul>
      </div>
    </nav>

    <main class="gr-shell">
      <div class="gr-page-intro">
        <h1 class="gr-title">forgot password?</h1>
        <p class="gr-subtitle">enter your email and we'll send you a reset link.</p>
      </div>

      <div class="gr-card gr-auth-card">
        <form id="forgot-form">
          <div class="gr-field-stack">
            <label class="gr-label">
              <span>email</span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
          </div>

          <div class="gr-auth-actions">
            <button type="submit" class="gr-btn gr-btn--primary" id="forgot-submit">send reset link</button>
            <a href="/signin.html" class="gr-inline-link gr-auth-actions__forgot">back to sign in</a>
          </div>
        </form>
      </div>
    </main>

    <script type="module">
      import { getSupabaseClient } from "/supabase-loader.js";
      import { showSuccess } from "/toast.js";

      const form = document.getElementById("forgot-form");
      const submitBtn = document.getElementById("forgot-submit");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = form.email.value.trim();
        if (!email) return;

        submitBtn.disabled = true;

        try {
          const supabase = await getSupabaseClient();
          const redirectTo = `${window.location.origin}/reset-password.html`;
          // We always show a success message, regardless of whether the email
          // exists, so we don't leak which addresses are registered. Supabase
          // itself doesn't reveal that distinction in the success response.
          await supabase.auth.resetPasswordForEmail(email, { redirectTo });
        } catch (_) {
          // Fall through to the generic success message — by design.
        }

        showSuccess("if an account exists for that email, a reset link is on its way. check your inbox (and spam folder).");
        form.email.value = "";
        submitBtn.disabled = false;
      });
    </script>
    <script defer src="/perf-beacon.js"></script>
  </body>
</html>
