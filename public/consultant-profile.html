<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grassroots — consultant profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/grassroots.css" />
    <link rel="stylesheet" href="/field-office.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="gr-body"><main class="gr-shell">
      <button type="button" class="ld-back" id="cp-back" style="background:none;border:0;font:inherit;cursor:pointer;padding:0;">&larr; back</button>
      <div class="gr-page-intro">
        <p class="gr-page-eyebrow">consultant snapshot</p>
        <h1 class="gr-title">consultant profile</h1>
        <p class="gr-subtitle">review shared background, links, and work samples before you reach out.</p>
      </div>
      <p id="status" class="gr-status" aria-live="polite">loading profile...</p>
      <div id="profile-content" class="hidden"></div>
    </main>

    <div class="pf-resume-viewer hidden" id="pf-resume-viewer" aria-hidden="true">
      <div class="pf-resume-viewer__backdrop" data-resume-viewer-close></div>
      <div class="pf-resume-viewer__dialog" role="dialog" aria-modal="true" aria-labelledby="pf-resume-viewer-title">
        <div class="pf-resume-viewer__bar">
          <div>
            <p class="pf-resume-viewer__eyebrow">resume preview</p>
            <h2 class="pf-resume-viewer__title" id="pf-resume-viewer-title">resume</h2>
          </div>
          <div class="pf-resume-viewer__controls">
            <a
              class="pf-resume-viewer__icon-btn"
              id="pf-resume-viewer-download"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              download
              aria-label="download resume"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 4v10"></path>
                <path d="m8 10 4 4 4-4"></path>
                <path d="M5 19h14"></path>
              </svg>
            </a>
            <button type="button" class="pf-resume-viewer__close" data-resume-viewer-close aria-label="close preview">
              &times;
            </button>
          </div>
        </div>
        <div class="pf-resume-viewer__stage">
          <iframe id="pf-resume-viewer-frame" class="pf-resume-viewer__frame" title="resume preview"></iframe>
        </div>
      </div>
    </div>

    <script type="module" src="/nav-session.js"></script>
    <script type="module">
      import { getSupabaseClient } from "/supabase-loader.js";
      import { renderRatingMarkup } from "/rating.js";
      import { getInitials } from "/initials.js";

      function escapeHtml(s) {
        return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function escapeAttr(s) {
        return String(s ?? "").replace(/"/g, "&quot;");
      }

      function getResumeActionMarkup(fileName, consultantId, previewLabel = "preview resume") {
        if (!consultantId) return "";
        const safeFileName = fileName || "resume";
        return `
          <span class="pf-bv__resume-actions">
            <button
              type="button"
              class="pf-bv__resume-btn"
              data-resume-action="preview"
              data-resume-consultant-id="${escapeAttr(consultantId)}"
              data-resume-file-name="${escapeAttr(safeFileName)}"
            >${escapeHtml(previewLabel)}</button>
            <button
              type="button"
              class="pf-bv__resume-download"
              data-resume-action="download"
              data-resume-consultant-id="${escapeAttr(consultantId)}"
              data-resume-file-name="${escapeAttr(safeFileName)}"
              aria-label="download resume"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 4v10"></path>
                <path d="m8 10 4 4 4-4"></path>
                <path d="M5 19h14"></path>
              </svg>
            </button>
          </span>
        `;
      }

      const resumeViewer = document.getElementById("pf-resume-viewer");
      const resumeViewerFrame = document.getElementById("pf-resume-viewer-frame");
      const resumeViewerTitle = document.getElementById("pf-resume-viewer-title");
      const resumeViewerDownload = document.getElementById("pf-resume-viewer-download");

      function openResumeViewer(url, fileName = "resume") {
        if (!resumeViewer || !resumeViewerFrame || !resumeViewerTitle || !resumeViewerDownload || !url) return;
        resumeViewerTitle.textContent = fileName;
        resumeViewerFrame.src = url;
        resumeViewerDownload.href = url;
        resumeViewerDownload.setAttribute("download", fileName);
        resumeViewer.classList.remove("hidden");
        resumeViewer.setAttribute("aria-hidden", "false");
        document.body.classList.add("gr-modal-open");
      }

      function closeResumeViewer() {
        if (!resumeViewer || !resumeViewerFrame) return;
        resumeViewer.classList.add("hidden");
        resumeViewer.setAttribute("aria-hidden", "true");
        resumeViewerFrame.src = "about:blank";
        document.body.classList.remove("gr-modal-open");
      }

      function triggerResumeDownload(url, fileName = "resume") {
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      async function requestResumeAccess(supabase, consultantId) {
        const {
          data: { session },
        } = await supabase.auth.getSession();
        const headers = {};
        if (session?.access_token) {
          headers.Authorization = `Bearer ${session.access_token}`;
        }

        const res = await fetch(`/api/consultant-profile/${encodeURIComponent(consultantId)}/resume`, {
          headers,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.url) {
          throw new Error(data.error || "Resume is not available.");
        }
        return data;
      }

      async function init() {
        const statusEl = document.getElementById("status");
        const contentEl = document.getElementById("profile-content");
        const params = new URLSearchParams(window.location.search);
        const consultantId = params.get("id");
        const supabase = await getSupabaseClient();

        if (!consultantId) {
          statusEl.textContent = "no consultant specified.";
          statusEl.className = "gr-status error";
          return;
        }

        try {
          const {
            data: { session },
          } = await supabase.auth.getSession();
          const headers = {};
          if (session?.access_token) {
            headers.Authorization = `Bearer ${session.access_token}`;
          }

          const res = await fetch(`/api/consultant-profile/${encodeURIComponent(consultantId)}`, {
            headers,
          });
          const data = await res.json();

          if (!res.ok || !data.profile) {
            statusEl.textContent = data.error || "consultant profile not found.";
            statusEl.className = "gr-status error";
            return;
          }

          const profile = data.profile;
          const edu = data.education || {};
          const portfolioItems = data.portfolio || [];

          const avatarHtml = profile.avatar_url
            ? `<img class="pf-bv__avatar" src="${escapeHtml(profile.avatar_url)}" alt="" />`
            : `<div class="pf-bv__avatar-placeholder" aria-hidden="true">${escapeHtml(getInitials(profile.full_name))}</div>`;

          const major = edu.major || "";
          const minor = edu.minor || "";
          const school = edu.school || "";
          let eduLine = "";
          if (major || school) {
            const parts = [];
            if (major) parts.push(major);
            if (minor) parts.push("minor in " + minor);
            if (school) parts.push(school);
            eduLine = parts.join(" \u00b7 ");
          }

          let portfolioHtml = "";
          if (portfolioItems.length) {
            portfolioHtml = `
              <div class="pf-bv__section">
                <p class="pf-bv__section-title">past experience</p>
                <div class="pf-bv__portfolio-grid">
                  ${portfolioItems.map((item) => {
                    const fileName = (item.file_path || "").split("/").pop() || "file";
                    const url = item.url || "#";
                    return `
                      <div class="pf-bv__portfolio-card">
                        <span class="pf-bv__portfolio-card__name">${escapeHtml(fileName)}</span>
                        ${item.description ? `<span class="pf-bv__portfolio-card__desc">${escapeHtml(item.description)}</span>` : ""}
                        <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">view</a>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            `;
          }

          document.title = `grassroots \u2014 ${profile.full_name || "consultant"}`;

          const rating = data.rating;
          const dims = [
            ["work product", rating?.work_product_quality_avg],
            ["communication", rating?.communication_avg],
            ["timeliness", rating?.timeliness_avg],
            ["professionalism", rating?.professionalism_avg],
            ["cost value", rating?.cost_value_avg],
          ];
          const ratingBreakdown = rating?.review_count
            ? `
              <div class="pf-bv__section">
                <p class="pf-bv__section-title">ratings · ${rating.review_count} review${rating.review_count === 1 ? "" : "s"}</p>
                <div class="ld-cv__rating-grid">
                  ${dims.map(([label, val]) => `
                    <div class="ld-cv__rating-row">
                      <span class="ld-cv__rating-row__label">${label}</span>
                      ${renderRatingMarkup({ rating_average: val, review_count: 1 }, { size: "sm", showCount: false })}
                    </div>
                  `).join("")}
                </div>
              </div>
            `
            : "";

          contentEl.innerHTML = `
            <div class="pf-bv">
              <div class="pf-bv__header">
                ${avatarHtml}
                <div>
                  <h2 class="pf-bv__name">${escapeHtml(profile.full_name)} ${renderRatingMarkup(rating, { size: "md" })}</h2>
                  ${eduLine ? `<p class="pf-bv__meta">${escapeHtml(eduLine)}</p>` : ""}
                </div>
              </div>

              ${ratingBreakdown}

              ${eduLine ? `
                <div class="pf-bv__section">
                  <p class="pf-bv__section-title">education</p>
                  <p class="pf-bv__detail">${escapeHtml(eduLine)}</p>
                </div>
              ` : ""}

              ${profile.linkedin_url ? `
                <div class="pf-bv__section">
                  <p class="pf-bv__section-title">linkedin</p>
                  <p class="pf-bv__detail"><a href="${escapeHtml(profile.linkedin_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(profile.linkedin_url)}</a></p>
                </div>
              ` : ""}

              ${profile.resume_on_file ? `
                <div class="pf-bv__section">
                  <p class="pf-bv__section-title">resume</p>
                  <div class="pf-bv__resume-row">
                    ${profile.resume_file_name ? `<span class="pf-bv__detail">${escapeHtml(profile.resume_file_name)}</span>` : ""}
                    ${getResumeActionMarkup(profile.resume_file_name, profile.id)}
                  </div>
                </div>
              ` : ""}

              ${portfolioHtml}

              ${!profile.linkedin_url && !portfolioItems.length && !profile.resume_on_file && !eduLine ? `
                <p class="pf-bv__empty">this consultant hasn't shared any public details yet.</p>
              ` : ""}
            </div>
          `;

          statusEl.textContent = "";
          contentEl.classList.remove("hidden");
        } catch (err) {
          statusEl.textContent = err.message || "could not load profile.";
          statusEl.className = "gr-status error";
        }
      }

      document.addEventListener("click", async (event) => {
        const resumeAction = event.target.closest("[data-resume-action]");
        if (resumeAction instanceof HTMLElement) {
          event.preventDefault();
          try {
            const action = resumeAction.getAttribute("data-resume-action") || "preview";
            const fileName = resumeAction.getAttribute("data-resume-file-name") || "resume";
            const consultantId = resumeAction.getAttribute("data-resume-consultant-id") || "";
            const access = await requestResumeAccess(await getSupabaseClient(), consultantId);
            if (action === "download") {
              triggerResumeDownload(access.url, access.file_name || fileName);
            } else {
              openResumeViewer(access.url, access.file_name || fileName);
            }
          } catch (err) {
            const statusEl = document.getElementById("status");
            if (statusEl) {
              statusEl.textContent = err.message || "Resume is not available.";
              statusEl.className = "gr-status error";
            }
          }
          return;
        }

        const closeTrigger = event.target.closest("[data-resume-viewer-close]");
        if (closeTrigger instanceof HTMLElement) {
          event.preventDefault();
          closeResumeViewer();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && resumeViewer && !resumeViewer.classList.contains("hidden")) {
          closeResumeViewer();
        }
      });

      // Back button: try history first, fall back to marketplace.
      document.getElementById("cp-back")?.addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "/";
        }
      });

      init();
    </script>
    <script type="module" src="/side-nav.js"></script>
  </body>
</html>
