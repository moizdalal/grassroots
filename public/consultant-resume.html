<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>Grassroots — consultant resume</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" />
    <link rel="stylesheet" href="/grassroots.css?v=2" />
    <link rel="stylesheet" href="/field-office.css" />
    <script src="/theme.js"></script>
    <script src="/cookie-banner.js" defer></script>
    <script src="/loading-overlay.js"></script>
  </head>
  <body class="gr-body"><main class="gr-shell gr-shell--wide">
      <a href="/profile.html" class="ld-back">← Back</a>

      <p id="cr-gate" class="gr-status" data-loading="true" aria-live="polite">Loading…</p>

      <div id="cr-shell" hidden>
        <div class="gr-page-intro">
          <h1 class="gr-title" id="cr-name">Consultant resume</h1>
          <p class="gr-subtitle" id="cr-program"></p>
        </div>

        <div class="cp-placeholder" id="cr-placeholder">
          <span class="cp-empty-tag">Work in progress</span>
          <h2>Resume page coming soon</h2>
          <p>This consultant hasn't built out a full resume page yet — for now, here's what's on file.</p>
        </div>

        <div id="cr-resume-card" class="bza__panel" hidden>
          <div class="bza__panel-h">
            <span class="bza__panel-h-title"><strong>Resume</strong></span>
          </div>
          <p id="cr-resume-link"></p>
        </div>

        <div id="cr-edu-card" class="bza__panel" hidden>
          <div class="bza__panel-h">
            <span class="bza__panel-h-title"><strong>Education</strong></span>
          </div>
          <p id="cr-edu-line" style="color:var(--fo-text);font-size:0.95rem;line-height:1.6;margin:0"></p>
        </div>

        <div id="cr-links-card" class="bza__panel" hidden>
          <div class="bza__panel-h">
            <span class="bza__panel-h-title"><strong>Links</strong></span>
          </div>
          <div id="cr-links" style="display:flex;gap:0.6rem;flex-wrap:wrap"></div>
        </div>
      </div>
    </main>

    <script type="module" src="/nav-session.js"></script>
    <script type="module">
      import { getSupabaseClient } from "/supabase-loader.js";

      const $ = (id) => document.getElementById(id);
      const escape = (s) =>
        String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      const isMissing = (err) =>
        !!err && /(does not exist|not found|relation .* does not exist|column .* does not exist)/i.test(err.message || "");

      async function init() {
        const id = new URLSearchParams(window.location.search).get("id");
        const gate = $("cr-gate");
        const shell = $("cr-shell");
        if (!id) {
          gate.textContent = "No consultant specified.";
          gate.className = "gr-status error";
          return;
        }

        try {
          const client = await getSupabaseClient();
          const { data: profile, error: pErr } = await client
            .from("profiles")
            .select("id, full_name, linkedin_url")
            .eq("id", id)
            .single();
          if (pErr) throw pErr;

          $("cr-name").textContent = profile?.full_name || "Consultant resume";

          let edu = null;
          const { data: cp, error: cpErr } = await client
            .from("consultant_profiles")
            .select("major, minor, school")
            .eq("user_id", id)
            .maybeSingle();
          if (!cpErr || isMissing(cpErr)) {
            edu = cp;
          }

          if (edu) {
            const bits = [edu.major, edu.minor ? `(minor: ${edu.minor})` : "", edu.school].filter(Boolean);
            if (bits.length) {
              $("cr-program").textContent = bits.join(" · ");
              $("cr-edu-line").textContent = bits.join(" · ");
              $("cr-edu-card").hidden = false;
            }
          }

          // The resumes bucket is private, so the server hands out a short-
          // lived signed link when the viewer is allowed to see it.
          const { data: { session } } = await client.auth.getSession();
          const headers = session?.access_token ? { Authorization: `Bearer ${session.access_token}` } : {};
          const resumeRes = await fetch(`/api/consultant-profile/${encodeURIComponent(id)}/resume`, { headers });
          const resumeBody = await resumeRes.json().catch(() => ({}));
          if (resumeRes.ok && resumeBody.url) {
            $("cr-resume-link").innerHTML = `<a href="${escape(resumeBody.url)}" target="_blank" rel="noopener" class="gr-btn gr-btn--primary" style="text-decoration:none">View resume PDF →</a>`;
            $("cr-resume-card").hidden = false;
            $("cr-placeholder").hidden = true;
          }

          if (profile?.linkedin_url) {
            $("cr-links").innerHTML = `<a href="${escape(profile.linkedin_url)}" target="_blank" rel="noopener" class="gr-btn gr-btn--ghost" style="text-decoration:none">LinkedIn →</a>`;
            $("cr-links-card").hidden = false;
          }

          gate.hidden = true;
          shell.hidden = false;
        } catch (err) {
          gate.textContent = err.message || "Could not load resume.";
          gate.className = "gr-status error";
        }
      }

      init();
    </script>
    <script type="module" src="/side-nav.js"></script>
    <script defer src="/perf-beacon.js"></script>
  </body>
</html>
