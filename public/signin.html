<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>grassroots — sign in</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/grassroots.css" />
    <link rel="stylesheet" href="/field-office.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="gr-body">
    <nav class="gr-nav" aria-label="Primary">
      <div class="gr-nav__inner">
        <a class="gr-nav__brand" href="/">
          <img class="gr-nav__logo" src="/home/assets/grassroots-icon-syne.svg" width="20" height="34" alt="" />
          <span class="gr-nav__wordmark">grassroots</span>
        </a>
        <ul class="gr-nav__links">
          <li><a href="/signin.html" aria-current="page">sign in</a></li>
          <li><a href="/register.html" class="gr-nav__cta">register</a></li>
          <li><a href="/profile.html">profile</a></li>
        </ul>
      </div>
    </nav>

    <main class="gr-shell">
      <div class="gr-page-intro">
        <h1 class="gr-title">welcome back</h1>
        <p class="gr-subtitle">use the email you registered with.</p>
      </div>

      <div class="gr-card gr-auth-card">
        <form id="signin-form">
          <div class="gr-field-stack">
            <label class="gr-label">
              <span>email</span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label class="gr-label">
              <span>password</span>
              <div class="gr-pw-field">
                <input
                  type="password"
                  name="password"
                  autocomplete="current-password"
                  required
                  id="signin-password"
                />
                <button
                  type="button"
                  class="gr-pw-toggle"
                  data-pw-toggle="signin-password"
                  aria-label="show password"
                  aria-pressed="false"
                >
                  <svg class="gr-pw-toggle__eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="gr-pw-toggle__eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.06 10.06 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                </button>
              </div>
            </label>
          </div>

          <div class="gr-auth-actions">
            <a href="/forgot-password.html" class="gr-auth-forgot">forgot password?</a>
            <button type="submit" class="gr-btn gr-btn--primary">
              sign in
            </button>
          </div>
        </form>

        <div id="oauth-slot"></div>

        <p id="status" class="gr-status" aria-live="polite"></p>

        <p class="gr-auth-footer">
          i remember my first time…
          <a href="/register.html" class="gr-inline-link">register</a>
        </p>
      </div>
    </main>

    <script type="module" src="/nav-session.js"></script>
    <script type="module" src="/signin.js"></script>

    <!-- Suggestion Box -->
    <button class="gr-suggest-btn" id="gr-suggest-btn" type="button" aria-label="suggestion box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
    </button>
    <div class="gr-suggest-overlay" id="gr-suggest-overlay">
      <div class="gr-suggest-popup">
        <button class="gr-suggest-popup__close" id="gr-suggest-close" type="button" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
        <div id="gr-suggest-form">
          <p class="gr-suggest-popup__title">grassroots values and takes your feedback seriously&mdash;how can we improve?</p>
          <textarea class="gr-suggest-popup__textarea" id="gr-suggest-input" placeholder="your suggestion…" maxlength="1000"></textarea>
          <button class="gr-suggest-popup__submit" id="gr-suggest-submit" type="button">submit</button>
        </div>
        <div id="gr-suggest-thanks" hidden>
          <p class="gr-suggest-popup__thanks">thanks for the note. we read all of these.</p>
        </div>
      </div>
    </div>
    <script defer src="/suggestion-box.js"></script>
  </body>
</html>
