<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grassroots — inbox</title>
    <link rel="icon" type="image/svg+xml" href="/home/assets/grassroots-icon-syne.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/grassroots.css" />
    <link rel="stylesheet" href="/field-office.css" />
    <script src="/theme.js"></script>
    <script src="/loading-overlay.js"></script>
  </head>
  <body class="gr-body gr-has-side-nav inbox-page">
    <main class="inbox-shell">
      <p id="inbox-gate" class="gr-status" aria-live="polite" style="padding:3rem 1.5rem;">loading…</p>

      <div class="inbox" id="inbox-shell" hidden>
        <aside class="inbox__list" aria-label="conversations">
          <div class="inbox__list-head">
            <div class="inbox__title-row">
              <h1 class="inbox__title">inbox</h1>
              <button type="button" class="inbox__mark-all" id="inbox-mark-all" hidden>mark all read</button>
            </div>
            <div class="inbox__filters">
              <button type="button" class="inbox__filter active" data-filter="all">all</button>
              <button type="button" class="inbox__filter" data-filter="unread">unread <span class="inbox__filter-count" id="inbox-unread-pill" hidden>0</span></button>
            </div>
            <input class="inbox__search" type="search" id="inbox-search" placeholder="search messages…" />
          </div>
          <div class="inbox__threads" id="inbox-threads" role="list"></div>
          <p class="inbox__empty" id="inbox-list-empty" hidden>no conversations yet.</p>
        </aside>

        <section class="inbox__pane" id="inbox-pane" aria-live="polite">
          <div class="inbox__placeholder" id="inbox-placeholder">
            <div class="inbox__placeholder-glyph" aria-hidden="true"></div>
            <p class="inbox__placeholder-title">select a conversation</p>
            <p class="inbox__placeholder-sub">your active threads, grouped by listing, show here.</p>
          </div>

          <div class="inbox__conversation" id="inbox-conversation" hidden>
            <header class="inbox__conv-head">
              <div class="inbox__conv-id">
                <div class="inbox__conv-avatar" id="inbox-conv-avatar"></div>
                <div class="inbox__conv-meta">
                  <span class="inbox__conv-name" id="inbox-conv-name"></span>
                  <a class="inbox__conv-listing" id="inbox-conv-listing" href="#"></a>
                </div>
              </div>
              <span class="inbox__conv-matches" id="inbox-conv-matches" aria-live="polite" hidden></span>
              <button type="button" class="inbox__conv-close" id="inbox-conv-close" aria-label="close conversation">×</button>
            </header>
            <div class="inbox__conv-body" id="inbox-conv-body" role="log"></div>
            <form class="inbox__composer" id="inbox-composer" autocomplete="off">
              <textarea
                class="inbox__composer-input"
                id="inbox-composer-input"
                placeholder="write a message…"
                rows="1"
                maxlength="4000"
                required
              ></textarea>
              <button type="submit" class="inbox__composer-send" id="inbox-composer-send">send</button>
            </form>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/nav-session.js"></script>
    <script type="module">
      import { initInbox } from "/inbox.js";
      (async () => {
        try {
          await initInbox();
          document.getElementById("inbox-gate").hidden = true;
          document.getElementById("inbox-shell").hidden = false;
        } catch (err) {
          const gate = document.getElementById("inbox-gate");
          gate.textContent = err?.message || "could not load inbox.";
          gate.className = "gr-status error";
        }
      })();
    </script>

    <!-- Suggestion Box -->
    <button class="gr-suggest-btn" id="gr-suggest-btn" type="button" aria-label="suggestion box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
    </button>
    <div class="gr-suggest-overlay" id="gr-suggest-overlay">
      <div class="gr-suggest-popup">
        <button class="gr-suggest-popup__close" id="gr-suggest-close" type="button" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
        <div id="gr-suggest-form">
          <p class="gr-suggest-popup__title">grassroots values and takes your feedback seriously&mdash;how can we improve?</p>
          <textarea class="gr-suggest-popup__textarea" id="gr-suggest-input" placeholder="your suggestion…" maxlength="1000"></textarea>
          <button class="gr-suggest-popup__submit" id="gr-suggest-submit" type="button">submit</button>
        </div>
        <div id="gr-suggest-thanks" hidden>
          <p class="gr-suggest-popup__thanks">thanks for the note. we read all of these.</p>
        </div>
      </div>
    </div>
    <script src="/suggestion-box.js"></script>
    <script type="module" src="/side-nav.js"></script>
  </body>
</html>
